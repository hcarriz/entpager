version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 2
    groups:
      tools-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
